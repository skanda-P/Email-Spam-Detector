<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spam Shield</title>
<style>
  :root {
    --bg:      linear-gradient(135deg, #0f1117 0%, #1a1820 100%);
    --bg-solid: #0f1117;
    --surface: #161b24;
    --surface-light: #1d2230;
    --border:  #2d3142;
    --text:    #e6eef5;
    --text-secondary: #a8b0be;
    --accent:  #6c63ff;
    --accent-alt: #8b5cf6;
    --spam:    #ff5555;
    --ham:     #2ecc71;
    --warn:    #f39c12;
    --radius:  14px;
    --shadow:  0 8px 24px rgba(0, 0, 0, 0.4);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 360px;
    min-height: 480px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    box-shadow: var(--shadow-sm);
  }
  .logo { font-size: 28px; } 
  .title { font-size: 18px; font-weight: 800; letter-spacing: -.5px; } 
  .subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 2px; font-weight: 500; }

  /* ── Settings row ── */
  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--surface-light);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 600;
  }
  .settings-row input {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 12px;
    padding: 6px 10px;
    width: 160px;
    transition: all 0.2s ease;
  }
  .settings-row input:focus { 
    outline: none; 
    border-color: var(--accent); 
    background: var(--bg-solid);
    box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.1);
  }

  /* ── Main body ── */
  main { padding: 22px 20px; }

  /* Scan button */
  #scanBtn {
    width: 100%;
    padding: 14px 16px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-alt) 100%);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 4px 15px rgba(108, 99, 255, 0.3);
    letter-spacing: 0.3px;
  }
  #scanBtn:hover  { 
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(108, 99, 255, 0.4);
  }
  #scanBtn:active { transform: translateY(0); }
  #scanBtn:disabled { 
    opacity: 0.6; 
    cursor: not-allowed;
    transform: none;
  }

  /* Result card */
  #resultCard {
    margin-top: 18px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    overflow: hidden;
    display: none;
    box-shadow: var(--shadow-sm);
    animation: slideIn 0.4s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .result-header {
    padding: 18px 18px 16px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }
  .result-icon { font-size: 32px; flex-shrink: 0; line-height: 1; }
  .result-label { font-size: 20px; font-weight: 900; letter-spacing: 0.5px; margin-bottom: 4px; }
  .result-sub   { font-size: 13px; color: rgba(255,255,255,.8); font-weight: 500; }

  .result-header.spam { background: linear-gradient(135deg, #c41e3a 0%, #8b0000 100%); }
  .result-header.ham  { background: linear-gradient(135deg, #26a65b 0%, #1e8449 100%); }

  /* Probability bars */
  .probs { padding: 16px 18px; background: var(--surface); }
  .prob-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .prob-row:last-child { margin-bottom: 0; }
  .prob-name { width: 44px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
  .bar-track {
    flex: 1; height: 6px; background: rgba(255,255,255,.08);
    border-radius: 99px; overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,.2);
  }
  .bar-fill {
    height: 100%; border-radius: 99px;
    transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 0 8px currentColor;
  }
  .bar-fill.spam { background: var(--spam); }
  .bar-fill.ham  { background: var(--ham); }
  .prob-pct { width: 38px; text-align: right; font-size: 13px; font-weight: 800; }

  /* Snippet preview */
  .snippet-box {
    margin-top: 14px;
    padding: 12px 14px;
    background: var(--surface);
    border-radius: 10px;
    border: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-secondary);
    max-height: 70px;
    overflow: hidden;
    line-height: 1.6;
    border-left: 3px solid var(--accent);
    animation: slideIn 0.4s ease;
  }

  /* Status / error */
  #status {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13px;
    text-align: center;
    display: none;
    font-weight: 500;
    animation: slideIn 0.3s ease;
  }
  #status.error   { background: rgba(255, 85, 85, 0.15); color: #ff9999; border: 1px solid rgba(255, 85, 85, 0.3); }
  #status.loading { background: var(--surface); color: var(--text-secondary); }

  /* Spinner */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 16px; height: 16px;
    border: 2.5px solid rgba(255,255,255,.2);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: none;
  }

  /* Utility animations */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

<header>
  <span class="logo">�</span>
  <div>
    <div class="title">Spam Guard</div>
    <div class="subtitle">Smart email protection</div>
  </div>
</header>

<div class="settings-row">
  <span>🔗 API URL</span>
  <input id="apiUrl" type="text" value="http://localhost:8000" placeholder="Backend URL"/>
</div>

<main>
  <button id="scanBtn">
    <span class="spinner" id="spinner"></span>
    <span id="btnLabel">⚡ Scan Email</span>
  </button>

  <div id="resultCard">
    <div class="result-header" id="resultHeader">
      <span class="result-icon" id="resultIcon"></span>
      <div>
        <div class="result-label" id="resultLabel"></div>
        <div class="result-sub"  id="resultSub"></div>
      </div>
    </div>
    <div class="probs">
      <div class="prob-row">
        <span class="prob-name" style="color:var(--spam)">🚨 SPAM</span>
        <div class="bar-track"><div class="bar-fill spam" id="spamBar" style="width:0%"></div></div>
        <span class="prob-pct" id="spamPct" style="color:var(--spam)"></span>
      </div>
      <div class="prob-row">
        <span class="prob-name" style="color:var(--ham)">✅ SAFE</span>
        <div class="bar-track"><div class="bar-fill ham"  id="hamBar"  style="width:0%"></div></div>
        <span class="prob-pct" id="hamPct"  style="color:var(--ham)"></span>
      </div>
    </div>
  </div>

  <div id="snippet" class="snippet-box" style="display:none"></div>
  <div id="status"></div>
</main>

<script src="popup.js"></script>
</body>
</html>
